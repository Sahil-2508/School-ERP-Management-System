name: Sync GitHub to Bitbucket

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout GitHub repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Push GitHub main to Bitbucket
        env:
          BB_TOKEN: ${{ secrets.BITBUCKET_TOKEN }}
          BB_WORKSPACE: ${{ secrets.BITBUCKET_WORKSPACE }}
          BB_REPO: ${{ secrets.BITBUCKET_REPO }}
        run: |
          set -eu

          # Remove any accidental spaces/newlines from the secrets
          BB_TOKEN="$(printf '%s' "$BB_TOKEN" | tr -d '[:space:]')"
          BB_WORKSPACE="$(printf '%s' "$BB_WORKSPACE" | tr -d '[:space:]')"
          BB_REPO="$(printf '%s' "$BB_REPO" | tr -d '[:space:]')"

          git push --force \
            "https://x-token-auth:${BB_TOKEN}@bitbucket.org/${BB_WORKSPACE}/${BB_REPO}.git" \
            "HEAD:refs/heads/main"
