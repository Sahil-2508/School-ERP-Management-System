
name: ASP.NET Core MVC CI-CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build, Test and Publish
    runs-on: ubuntu-latest

    steps:
      # 1. Download source code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Install .NET 8 SDK
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # 3. Restore NuGet packages
      - name: Restore Dependencies
        run: dotnet restore

      # 4. Build application
      - name: Build Application
        run: dotnet build --configuration Release --no-restore

      # 5. Run tests
      - name: Run Tests
        run: dotnet test --configuration Release --no-build

      # 6. Publish application
      - name: Publish Application
        run: dotnet publish --configuration Release --no-build --output ./publish

      # 7. Deploy to Render only after a successful push to main
      - name: Deploy to Render
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.PRODUCTION }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "ERROR: GitHub Secret PRODUCTION is missing."
            exit 1
          fi

          curl --fail --silent --show-error \
            --request POST \
            "$RENDER_DEPLOY_HOOK"

          echo "Render deployment trigger sent successfully."
